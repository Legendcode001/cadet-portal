<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Gallery - 3rd Brigade Headquarters</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="./img/cadetlogo_prev_ui.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #2d3748;
        }

        ::-webkit-scrollbar-thumb {
            background-color: #4a5568;
            border-radius: 5px;
            border: 2px solid #2d3748;
        }

        .active-gallery {
            background-color: #1a202c !important;
            border: 1px solid #4a5568;
            color: #fff;
        }

        .modal-content {
            animation: zoom .5s;
        }

        @keyframes zoom {
            from {
                transform: scale(0.7);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .gallery-card {
            aspect-ratio: 16/10;
            overflow: hidden;
            border-radius: .75rem;
        }

        .nav a {
            color: green;
        }
    </style>
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">

    <header class="bg-gray-800 shadow-lg py-6 px-4">
        <div class="container mx-auto flex flex-col sm:flex-row justify-between items-center">
            <h1 class="text-3xl font-bold tracking-tight">3BRIGADE - PHOTO GALLERY</h1>
            <div class="nav">
                <nav class="mt-4 sm:mt-0 space-x-4">
                    <a href="index.html"
                        class="text-gray-300 hover:text-green transition-colors duration-300 font-medium">Home</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="flex-grow container mx-auto p-6">
        <section class="text-center mb-8">
            <h2 class="text-2xl font-semibold text-gray-300 mb-4">Explore Past Galleries</h2>
            <div class="flex flex-wrap justify-center gap-4 mb-6" id="year-nav"></div>
            <div id="category-nav" class="flex flex-wrap justify-center gap-4"></div>
        </section>

        <div id="loading-indicator" class="text-center py-12 hidden">
            <svg class="animate-spin h-8 w-8 text-gray-400 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none"
                viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor"
                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                </path>
            </svg>
            <p class="mt-3 text-gray-500">Loading gallery content...</p>
        </div>

        <section id="gallery-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></section>
    </main>

    <div id="imageModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-90 hidden">
        <button id="closeModal"
            class="absolute top-4 right-6 text-white text-4xl font-light cursor-pointer hover:text-gray-300">&times;</button>
        <button id="prevImage"
            class="absolute left-6 text-white text-4xl font-light hover:text-gray-300">&#10094;</button>
        <button id="nextImage"
            class="absolute right-6 text-white text-4xl font-light hover:text-gray-300">&#10095;</button>
        <div class="relative max-w-5xl mx-auto p-4 text-center">
            <img id="modalImage" class="w-full max-h-[80vh] rounded-lg shadow-2xl object-contain modal-content"
                alt="Enlarged gallery image">
            <div id="modalCaption" class="text-center mt-4 text-gray-300 text-lg font-medium"></div>
        </div>
    </div>

    <footer class="bg-gray-800 shadow-inner py-6 text-center mt-auto">
        <div class="container mx-auto text-sm text-gray-400">
            <p>&copy; 2025 3rd Brigade Headquarters. All Rights Reserved.</p>
            <div class="mt-2 space-x-4">
                <a href="https://www.facebook.com" target="_blank"
                    class="hover:text-white transition-colors duration-300">Facebook</a> |
                <a href="https://www.instagram.com" target="_blank"
                    class="hover:text-white transition-colors duration-300">Instagram</a> |
                <a href="https://www.tiktok.com" target="_blank"
                    class="hover:text-white transition-colors duration-300">TikTok</a>
            </div>
        </div>
    </footer>

    <script>
        const API_ENDPOINT = window.location.origin + "/cadetportal/admin/api.php";
        const galleryGrid = document.getElementById('gallery-grid');
        const yearNav = document.getElementById('year-nav');
        const categoryNav = document.getElementById('category-nav');
        const loadingIndicator = document.getElementById('loading-indicator');

        const imageModal = document.getElementById('imageModal');
        const modalImage = document.getElementById('modalImage');
        const modalCaption = document.getElementById('modalCaption');
        const closeModalBtn = document.getElementById('closeModal');
        const prevImageBtn = document.getElementById('prevImage');
        const nextImageBtn = document.getElementById('nextImage');

        let galleryData = {};
        let currentYear = null;
        let currentImages = [];
        let currentIndex = 0;

        // Normalize image URLs: handle img folder or uploads
        function normalizeUrl(rawUrl) {
            if (!rawUrl) return rawPlaceholder();
            if (/^https?:\/\//i.test(rawUrl)) return rawUrl;
            const filename = rawUrl.split('/').pop();
            // Prefer uploads folder if exists
            const uploadsPath = window.location.origin + '/cadetportal/uploads/' + filename;
            const imgPath = window.location.origin + '/cadetportal/img/' + filename;
            // Check if uploads file exists by trying to load
            return uploadsPath; // always point to uploads; if missing, onerror fallback will use placeholder
        }

        function rawPlaceholder() {
            return '/cadetportal/img/C1.jpg'; // fallback placeholder in img folder
        }

        async function loadCategories() {
            try {
                loadingIndicator.classList.remove('hidden');
                const res = await fetch(`${API_ENDPOINT}?action=get_categories`, { credentials: 'same-origin' });
                const data = await res.json();
                if (!data || data.success === false) throw new Error((data && data.message) ? data.message : 'Failed to load categories');
                galleryData = {}; yearNav.innerHTML = '';
                data.data.forEach(yearObj => {
                    const y = String(yearObj.year);
                    galleryData[y] = {};
                    (yearObj.subcategories || []).forEach(sub => {
                        const images = (sub.images || []).map(img => ({
                            id: img.id,
                            title: img.title || img.filename || img.url.split('/').pop(),
                            url: normalizeUrl(img.url)
                        }));
                        galleryData[y][sub.name] = images;
                    });
                    const btn = document.createElement('button');
                    btn.id = `btn-${y}`;
                    btn.textContent = y;
                    btn.className = "px-6 py-2 bg-gray-700 hover:bg-gray-600 transition-colors duration-300 rounded-full font-medium shadow-md";
                    btn.addEventListener('click', () => changeGallery(y));
                    yearNav.appendChild(btn);
                });
                if (data.data.length > 0) changeGallery(String(data.data[0].year));
                else galleryGrid.innerHTML = '<p class="text-center text-gray-400 col-span-full">No galleries available.</p>';
            } catch (err) {
                console.error('Error loading categories:', err);
                galleryGrid.innerHTML = `<p class="text-center text-red-400 col-span-full">Error loading gallery: ${err.message}</p>`;
            } finally {
                loadingIndicator.classList.add('hidden');
            }
        }

        function renderCategoryButtons(year) {
            categoryNav.innerHTML = '';
            const categories = galleryData[year];
            if (!categories) return;
            const allBtn = document.createElement('button');
            allBtn.textContent = 'All';
            allBtn.className = 'px-6 py-2 bg-gray-700 hover:bg-gray-600 transition-colors duration-300 rounded-full font-medium shadow-md active-gallery';
            allBtn.addEventListener('click', () => renderCategory(year, 'all'));
            categoryNav.appendChild(allBtn);
            for (const cat in categories) {
                const btn = document.createElement('button');
                btn.textContent = cat;
                btn.className = 'px-6 py-2 bg-gray-700 hover:bg-gray-600 transition-colors duration-300 rounded-full font-medium shadow-md';
                btn.addEventListener('click', () => renderCategory(year, cat));
                categoryNav.appendChild(btn);
            }
        }

        function createImageElement(image, index) {
            const wrapper = document.createElement('div');
            wrapper.className = 'gallery-card relative group cursor-pointer shadow-xl';
            const img = document.createElement('img');
            img.loading = 'lazy';
            img.src = image.url || rawPlaceholder();
            img.alt = image.title || '';
            img.className = 'w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-500 rounded-lg';
            img.onerror = function () { this.onerror = null; this.src = rawPlaceholder(); };
            const overlay = document.createElement('div');
            overlay.className = 'absolute inset-0 flex items-end p-3 bg-gradient-to-t from-gray-900/80 to-transparent rounded-lg';
            const title = document.createElement('p');
            title.className = 'text-xs sm:text-sm font-semibold text-gray-200';
            title.textContent = image.title || '';
            overlay.appendChild(title);
            wrapper.appendChild(img);
            wrapper.appendChild(overlay);
            wrapper.addEventListener('click', () => openModal(index));
            return wrapper;
        }

        function renderCategory(year, category) {
            galleryGrid.innerHTML = '';
            loadingIndicator.classList.remove('hidden');
            setTimeout(() => {
                let images = [];
                if (category === 'all') {
                    for (const cat in galleryData[year]) images = images.concat(galleryData[year][cat]);
                } else {
                    images = galleryData[year][category] || [];
                }
                if (!images.length) {
                    galleryGrid.innerHTML = '<p class="text-center text-gray-400 col-span-full">No images available.</p>';
                    currentImages = [];
                    currentIndex = 0;
                } else {
                    currentImages = images;
                    currentIndex = 0;
                    images.forEach((img, i) => galleryGrid.appendChild(createImageElement(img, i)));
                }
                loadingIndicator.classList.add('hidden');
            }, 150);
        }

        function changeGallery(year) {
            currentYear = year;
            yearNav.querySelectorAll('button').forEach(b => b.classList.remove('active-gallery'));
            const ybtn = document.getElementById(`btn-${year}`);
            if (ybtn) ybtn.classList.add('active-gallery');
            renderCategoryButtons(year);
            renderCategory(year, 'all');
        }

        function openModal(index) {
            if (!currentImages.length) return;
            currentIndex = index;
            showImage();
            imageModal.classList.remove('hidden');
        }

        function showImage() {
            const img = currentImages[currentIndex];
            if (!img) return;
            modalImage.src = img.url || rawPlaceholder();
            modalCaption.textContent = img.title || '';
        }

        function closeModal() {
            imageModal.classList.add('hidden');
        }

        closeModalBtn.addEventListener('click', closeModal);
        prevImageBtn.addEventListener('click', () => {
            if (!currentImages.length) return;
            currentIndex = (currentIndex - 1 + currentImages.length) % currentImages.length;
            showImage();
        });
        nextImageBtn.addEventListener('click', () => {
            if (!currentImages.length) return;
            currentIndex = (currentIndex + 1) % currentImages.length;
            showImage();
        });
        document.addEventListener('keydown', (e) => {
            if (imageModal.classList.contains('hidden')) return;
            if (e.key === 'Escape') closeModal();
            if (e.key === 'ArrowLeft') prevImageBtn.click(); sss
            if (e.key === 'ArrowRight') nextImageBtn.click();
        });

        document.addEventListener('DOMContentLoaded', loadCategories);
    </script>
</body>

</html>
