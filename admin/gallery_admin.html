<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Manager & Category Uploader</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }

        /* Custom scrollbar for gallery */
        #uploaded-images-container::-webkit-scrollbar {
            height: 8px;
        }

        #uploaded-images-container::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 10px;
        }
    </style>
</head>

<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <header class="bg-white p-6 rounded-xl shadow-lg mb-8">
            <h1 class="text-3xl font-extrabold text-gray-900 mb-2">Image Manager</h1>
            <p class="text-gray-600">
                Logged in as: <span id="user-id-display"
                    class="font-mono text-sm bg-gray-100 p-1 rounded-md text-purple-600">Loading...</span>
            </p>
        </header>

        <div id="loading-spinner" class="text-center py-20">
            <svg class="animate-spin h-8 w-8 text-purple-500 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none"
                viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor"
                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                </path>
            </svg>
            <p class="text-gray-500 mt-3">Initializing Firebase...</p>
        </div>

        <div id="app-content" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Left Column: Category Manager -->
            <div class="lg:col-span-1 bg-white p-6 rounded-xl shadow-lg h-fit">
                <h2 class="text-2xl font-bold text-gray-800 mb-4 border-b pb-2">Category Manager</h2>

                <!-- Add New Category Form -->
                <form id="add-category-form" class="mb-6">
                    <label for="new-category-name" class="block text-sm font-medium text-gray-700 mb-1">New Category
                        Name</label>
                    <input type="text" id="new-category-name" required
                        class="w-full p-2 border border-gray-300 rounded-lg focus:ring-purple-500 focus:border-purple-500 mb-3"
                        placeholder="e.g., Landscapes">
                    <button type="submit"
                        class="w-full bg-purple-600 text-white p-2 rounded-lg font-semibold hover:bg-purple-700 transition duration-150 shadow-md">
                        Add Category
                    </button>
                    <p id="category-message" class="text-sm mt-2 hidden"></p>
                </form>

                <!-- Category List -->
                <h3 class="text-xl font-semibold text-gray-800 mb-3">Existing Categories</h3>
                <ul id="categories-list" class="space-y-2 max-h-64 overflow-y-auto">
                    <li class="text-gray-500 italic p-2 bg-gray-50 rounded-lg">No categories added yet.</li>
                </ul>
            </div>

            <!-- Right Column: Image Uploader and Gallery -->
            <div class="lg:col-span-2 space-y-8">
                <!-- Image Uploader -->
                <div class="bg-white p-6 rounded-xl shadow-lg">
                    <h2 class="text-2xl font-bold text-gray-800 mb-4 border-b pb-2">Image Uploader</h2>

                    <form id="upload-form" class="space-y-4">
                        <div>
                            <label for="image-file" class="block text-sm font-medium text-gray-700 mb-1">Select Image
                                File</label>
                            <input type="file" id="image-file" accept="image/*" required
                                class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-purple-50 file:text-purple-700 hover:file:bg-purple-100">
                        </div>

                        <div>
                            <label for="image-category" class="block text-sm font-medium text-gray-700 mb-1">Assign
                                Category</label>
                            <select id="image-category" required
                                class="w-full p-2 border border-gray-300 rounded-lg focus:ring-purple-500 focus:border-purple-500 bg-white">
                                <option value="" disabled selected>Select a category</option>
                            </select>
                        </div>

                        <button type="submit" id="upload-button"
                            class="w-full bg-green-600 text-white p-3 rounded-lg font-semibold hover:bg-green-700 transition duration-150 shadow-md disabled:opacity-50"
                            disabled>
                            Upload Image
                        </button>
                        <progress id="upload-progress" value="0" max="100"
                            class="w-full h-2 rounded-full hidden"></progress>
                        <p id="upload-message" class="text-sm mt-2 hidden"></p>
                    </form>
                </div>

                <!-- Image Gallery -->
                <div class="bg-white p-6 rounded-xl shadow-lg">
                    <h2 class="text-2xl font-bold text-gray-800 mb-4 border-b pb-2">Image Gallery</h2>
                    <div id="uploaded-images-container" class="flex overflow-x-auto space-x-4 pb-4">
                        <p id="empty-gallery-message" class="text-gray-500 italic">No images uploaded yet.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, addDoc, onSnapshot, collection, query, serverTimestamp, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";
        import { setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app-check.js";

        // Firebase Setup - Environment variables are automatically injected
        setLogLevel('Debug');
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        let app, db, auth, storage, userId;

        const loadingSpinner = document.getElementById('loading-spinner');
        const appContent = document.getElementById('app-content');
        const userIdDisplay = document.getElementById('user-id-display');
        const uploadButton = document.getElementById('upload-button');

        // References to UI elements
        const categoryForm = document.getElementById('add-category-form');
        const categoryInput = document.getElementById('new-category-name');
        const categoriesList = document.getElementById('categories-list');
        const categoryMessage = document.getElementById('category-message');
        const imageCategorySelect = document.getElementById('image-category');

        const uploadForm = document.getElementById('upload-form');
        const imageFile = document.getElementById('image-file');
        const uploadProgress = document.getElementById('upload-progress');
        const uploadMessage = document.getElementById('upload-message');
        const imagesContainer = document.getElementById('uploaded-images-container');
        const emptyGalleryMessage = document.getElementById('empty-gallery-message');

        /**
         * Initializes Firebase and handles authentication.
         */
        async function initializeFirebase() {
            if (!firebaseConfig) {
                console.error("Firebase configuration is missing.");
                userIdDisplay.textContent = "Error: Config Missing";
                loadingSpinner.classList.add('hidden');
                return;
            }

            try {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                storage = getStorage(app);

                // Authenticate
                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        userId = user.uid;
                        userIdDisplay.textContent = userId;
                        loadingSpinner.classList.add('hidden');
                        appContent.classList.remove('hidden');

                        // Start real-time listeners only after successful auth
                        listenForCategories();
                        listenForImages();
                    } else {
                        // Handle sign out if necessary, though user should always be signed in/anonymously
                        userIdDisplay.textContent = "Signed Out";
                    }
                });

            } catch (error) {
                console.error("Firebase initialization failed:", error);
                userIdDisplay.textContent = "Error: " + error.message;
                loadingSpinner.classList.add('hidden');
            }
        }

        // --- Firestore Utilities ---

        /**
         * Returns the path to the user's private category collection.
         */
        function getCategoryCollectionRef() {
            if (!db || !userId) return null;
            return collection(db, 'artifacts', appId, 'users', userId, 'image_categories');
        }

        /**
         * Returns the path to the user's private image metadata collection.
         */
        function getImageCollectionRef() {
            if (!db || !userId) return null;
            return collection(db, 'artifacts', appId, 'users', userId, 'uploaded_images');
        }

        // --- Category Management ---

        categoryForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = categoryInput.value.trim();
            if (!name) return;

            const categoriesRef = getCategoryCollectionRef();
            if (!categoriesRef) return console.error("Database or User ID not ready.");

            try {
                // Add the category to Firestore
                await addDoc(categoriesRef, {
                    name: name,
                    createdAt: serverTimestamp()
                });

                categoryInput.value = '';
                displayMessage(categoryMessage, `Category '${name}' added successfully!`, 'text-green-600');

            } catch (e) {
                console.error("Error adding document: ", e);
                displayMessage(categoryMessage, `Error adding category: ${e.message}`, 'text-red-600');
            }
        });

        /**
         * Sets up a real-time listener for categories and updates the UI.
         */
        function listenForCategories() {
            const categoriesRef = getCategoryCollectionRef();
            if (!categoriesRef) return;

            onSnapshot(categoriesRef, (snapshot) => {
                categoriesList.innerHTML = '';
                imageCategorySelect.innerHTML = '<option value="" disabled selected>Select a category</option>';
                const categories = [];

                if (snapshot.empty) {
                    categoriesList.innerHTML = '<li class="text-gray-500 italic p-2 bg-gray-50 rounded-lg">No categories added yet.</li>';
                    uploadButton.disabled = true;
                    return;
                }

                snapshot.forEach((doc) => {
                    const category = { id: doc.id, ...doc.data() };
                    categories.push(category);

                    // Add to list UI
                    const li = document.createElement('li');
                    li.className = 'flex justify-between items-center p-3 bg-white border border-gray-200 rounded-lg shadow-sm hover:shadow-md transition duration-150';
                    li.innerHTML = `
                        <span class="font-medium text-gray-700">${category.name}</span>
                        <button data-id="${category.id}" data-name="${category.name}" class="delete-category-btn text-red-500 hover:text-red-700 p-1 rounded-full hover:bg-red-50 transition duration-150" title="Delete Category">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 pointer-events-none" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm4 0a1 1 0 10-2 0v6a1 1 0 102 0V8z" clip-rule="evenodd" />
                            </svg>
                        </button>
                    `;
                    categoriesList.appendChild(li);

                    // Add to Select dropdown
                    const option = document.createElement('option');
                    option.value = category.id;
                    option.textContent = category.name;
                    imageCategorySelect.appendChild(option);
                });

                uploadButton.disabled = false;
            });
        }

        // Delegated event listener for category deletion
        categoriesList.addEventListener('click', async (e) => {
            if (e.target.closest('.delete-category-btn')) {
                const button = e.target.closest('.delete-category-btn');
                const id = button.dataset.id;
                const name = button.dataset.name;

                // Simple custom confirmation (since alert/confirm is forbidden)
                if (!window.confirm(`Are you sure you want to delete the category: ${name}? This will NOT delete associated images.`)) {
                    return;
                }

                try {
                    const docRef = doc(getCategoryCollectionRef(), id);
                    await deleteDoc(docRef);
                    displayMessage(categoryMessage, `Category '${name}' deleted.`, 'text-orange-600');
                } catch (error) {
                    console.error("Error deleting category: ", error);
                    displayMessage(categoryMessage, `Error deleting category: ${error.message}`, 'text-red-600');
                }
            }
        });

        // --- Image Upload & Storage ---

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const file = imageFile.files[0];
            const categoryId = imageCategorySelect.value;
            if (!file || !categoryId) {
                displayMessage(uploadMessage, "Please select a file and a category.", 'text-red-600');
                return;
            }

            uploadButton.disabled = true;
            uploadProgress.classList.remove('hidden');
            uploadMessage.classList.add('hidden');

            const storageRef = ref(storage, `images/${userId}/${file.name}-${Date.now()}`);
            const uploadTask = uploadBytesResumable(storageRef, file);

            uploadTask.on('state_changed',
                (snapshot) => {
                    // Update progress bar
                    const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                    uploadProgress.value = progress;
                },
                (error) => {
                    // Handle unsuccessful uploads
                    console.error("Upload error:", error);
                    displayMessage(uploadMessage, `Upload failed: ${error.message}`, 'text-red-600');
                    uploadButton.disabled = false;
                    uploadProgress.classList.add('hidden');
                },
                async () => {
                    // Handle successful uploads on complete
                    try {
                        const downloadURL = await getDownloadURL(uploadTask.snapshot.ref);

                        // Save image metadata to Firestore
                        const imagesRef = getImageCollectionRef();
                        if (imagesRef) {
                            await addDoc(imagesRef, {
                                name: file.name,
                                url: downloadURL,
                                categoryId: categoryId,
                                size: file.size,
                                uploadedAt: serverTimestamp()
                            });

                            displayMessage(uploadMessage, "Image uploaded and metadata saved successfully!", 'text-green-600');
                            uploadForm.reset(); // Clear form
                        } else {
                            throw new Error("Could not get image metadata reference.");
                        }
                    } catch (e) {
                        console.error("Error saving metadata:", e);
                        displayMessage(uploadMessage, `Upload complete, but metadata saving failed: ${e.message}`, 'text-red-600');
                    } finally {
                        uploadButton.disabled = false;
                        uploadProgress.classList.add('hidden');
                    }
                }
            );
        });

        // --- Image Gallery Display ---

        /**
         * Sets up a real-time listener for uploaded image metadata and displays them.
         */
        function listenForImages() {
            const imagesRef = getImageCollectionRef();
            if (!imagesRef) return;

            onSnapshot(imagesRef, (snapshot) => {
                imagesContainer.innerHTML = '';
                const categoryMap = getCategoryMap(); // Get current category map
                const images = [];

                if (snapshot.empty) {
                    emptyGalleryMessage.classList.remove('hidden');
                    return;
                }
                emptyGalleryMessage.classList.add('hidden');

                snapshot.forEach((doc) => {
                    images.push({ id: doc.id, ...doc.data() });
                });

                // Sort by uploadedAt descending
                images.sort((a, b) => (b.uploadedAt?.toMillis() || 0) - (a.uploadedAt?.toMillis() || 0));

                images.forEach((image) => {
                    const categoryName = categoryMap[image.categoryId] || 'Uncategorized';
                    const card = document.createElement('div');
                    card.className = 'flex-shrink-0 w-64 bg-gray-50 rounded-xl overflow-hidden shadow-lg border border-gray-200';
                    card.innerHTML = `
                        <img src="${image.url}" alt="${image.name}" class="w-full h-40 object-cover" onerror="this.onerror=null;this.src='https://placehold.co/256x160/cbd5e1/475569?text=Image+Load+Error'">
                        <div class="p-4">
                            <p class="text-sm font-semibold text-gray-800 truncate" title="${image.name}">${image.name}</p>
                            <span class="inline-block text-xs font-medium px-2 py-0.5 mt-1 rounded-full bg-purple-100 text-purple-800">${categoryName}</span>
                            <div class="flex justify-end mt-3">
                                <button data-id="${image.id}" class="delete-image-btn text-red-500 hover:text-red-700 transition duration-150 text-sm font-medium">Delete</button>
                            </div>
                        </div>
                    `;
                    imagesContainer.appendChild(card);
                });
            });
        }

        /**
         * Helper to create a category ID to Name map from the select options.
         * Note: This is a simple way to map names for display purposes.
         */
        function getCategoryMap() {
            const map = {};
            for (let i = 0; i < imageCategorySelect.options.length; i++) {
                const option = imageCategorySelect.options[i];
                if (option.value) {
                    map[option.value] = option.textContent;
                }
            }
            return map;
        }


        imagesContainer.addEventListener('click', async (e) => {
            if (e.target.closest('.delete-image-btn')) {
                const button = e.target.closest('.delete-image-btn');
                const id = button.dataset.id;

                if (!window.confirm("Are you sure you want to delete this image?")) {
                    return;
                }

                try {
                    // Note: This only deletes the metadata from Firestore.
                    // The actual file in Storage will remain until manually cleaned up.
                    const docRef = doc(getImageCollectionRef(), id);
                    await deleteDoc(docRef);
                    displayMessage(uploadMessage, 'Image metadata deleted successfully.', 'text-orange-600');
                } catch (error) {
                    console.error("Error deleting image metadata: ", error);
                    displayMessage(uploadMessage, `Error deleting image: ${error.message}`, 'text-red-600');
                }
            }
        });


        // --- Utility Functions ---

        function displayMessage(element, message, className) {
            element.textContent = message;
            element.className = `text-sm mt-2 ${className}`;
            element.classList.remove('hidden');
            setTimeout(() => {
                element.classList.add('hidden');
            }, 5000);
        }

        // Initialize the app when the script runs
        initializeFirebase();

    </script>
</body>

</html>
